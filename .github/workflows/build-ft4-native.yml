# Build native ft4_coder (WSJT-X Fortran + shim) for all OscarWatch publish RIDs.
# Manual run: Actions → Build FT4 native → Run workflow.

name: Build FT4 native

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - "native/ft4_coder/**"
      - ".github/workflows/build-ft4-native.yml"
  pull_request:
    paths:
      - "native/ft4_coder/**"
      - ".github/workflows/build-ft4-native.yml"

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.display_name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            display_name: Windows x64
          - rid: linux-x64
            os: ubuntu-latest
            display_name: Linux x64
          - rid: linux-arm64
            os: ubuntu-24.04-arm
            display_name: Linux ARM64
          - rid: osx-x64
            os: macos-latest
            display_name: macOS Intel
            cmake_osx_arch: x86_64
          - rid: osx-arm64
            os: macos-latest
            display_name: macOS Apple Silicon
            cmake_osx_arch: arm64

    steps:
      - uses: actions/checkout@v4

      - name: Install MSYS2 toolchain (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-gcc-fortran
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-ninja
            mingw-w64-x86_64-fftw
            mingw-w64-x86_64-boost
            mingw-w64-x86_64-make

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ gfortran libfftw3-dev libboost-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: |
          brew install gcc ninja boost
          if [ "${{ matrix.rid }}" != "osx-x64" ]; then
            brew install fftw
          fi

      - name: Build x86_64 FFTW (macOS Intel RID)
        if: runner.os == 'macOS' && matrix.rid == 'osx-x64'
        shell: bash
        run: |
          GCC_PREFIX="$(brew --prefix gcc)"
          GCC_MAJOR="$(ls "${GCC_PREFIX}/bin" | sed -n 's/^gcc-\([0-9]*\)$/\1/p' | sort -n | tail -1)"
          export CC="${GCC_PREFIX}/bin/gcc-${GCC_MAJOR} -arch x86_64"
          export CXX="${GCC_PREFIX}/bin/g++-${GCC_MAJOR} -arch x86_64"
          export F77="${GCC_PREFIX}/bin/gfortran-${GCC_MAJOR} -arch x86_64"
          FFTW_PREFIX="${RUNNER_TEMP}/fftw-x86_64"
          curl -fsSL https://www.fftw.org/fftw-3.3.10.tar.gz -o "${RUNNER_TEMP}/fftw.tar.gz"
          tar -xzf "${RUNNER_TEMP}/fftw.tar.gz" -C "${RUNNER_TEMP}"
          cd "${RUNNER_TEMP}/fftw-3.3.10"
          ./configure --prefix="${FFTW_PREFIX}" --enable-float --enable-shared --disable-static --enable-threads
          make -j"$(sysctl -n hw.ncpu)"
          make install
          echo "FFTW3_PREFIX=${FFTW_PREFIX}" >> "$GITHUB_ENV"
          echo "FFTW3F_LIB=${FFTW_PREFIX}/lib/libfftw3f.dylib" >> "$GITHUB_ENV"
          echo "FFTW3F_THREADS_LIB=${FFTW_PREFIX}/lib/libfftw3f_threads.dylib" >> "$GITHUB_ENV"

      - name: Configure and build (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          cmake -S native/ft4_coder -B build-ft4 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ft4
          ctest --test-dir build-ft4 --output-on-failure

      - name: Configure and build (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          test -f native/ft4_coder/cmake/WsjtxLibSources.cmake
          test -f native/ft4_coder/src/wsjtx_decode_stubs.c
          grep -q 'lib/fst4/fastosd240_74.f90' native/ft4_coder/cmake/WsjtxLibSources.cmake
          grep -q 'lib/gran.c' native/ft4_coder/cmake/WsjtxLibSources.cmake
          grep -q 'LINKER_LANGUAGE CXX' native/ft4_coder/CMakeLists.txt
          cmake -S native/ft4_coder -B build-ft4 -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build-ft4
          ctest --test-dir build-ft4 --output-on-failure

      - name: Configure and build (macOS)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CMAKE_OSX_ARCHITECTURES: ${{ matrix.cmake_osx_arch }}
        run: |
          GCC_PREFIX="$(brew --prefix gcc)"
          GCC_MAJOR="$(ls "${GCC_PREFIX}/bin" | sed -n 's/^gcc-\([0-9]*\)$/\1/p' | sort -V | tail -1)"
          GFORTRAN="${GCC_PREFIX}/bin/gfortran-${GCC_MAJOR}"
          if [ ! -x "$GFORTRAN" ]; then
            echo "gfortran not found under ${GCC_PREFIX}/bin"
            ls -la "${GCC_PREFIX}/bin"
            exit 1
          fi

          CMAKE_ARGS=(
            -S native/ft4_coder
            -B build-ft4
            -G Ninja
            -DCMAKE_BUILD_TYPE=Release
            -DCMAKE_OSX_ARCHITECTURES="${CMAKE_OSX_ARCHITECTURES}"
          )

          # GitHub macOS runners are Apple Silicon; osx-x64 must cross-compile with -arch x86_64
          # or CMake rejects arm64 Homebrew gfortran when CMAKE_OSX_ARCHITECTURES=x86_64.
          if [ "${{ matrix.rid }}" = "osx-x64" ]; then
            WRAPPER_DIR="${RUNNER_TEMP}/ft4-compiler-wrappers"
            mkdir -p "${WRAPPER_DIR}"
            for tool in gcc g++ gfortran; do
              printf '%s\n' '#!/usr/bin/env bash' \
                "exec \"${GCC_PREFIX}/bin/${tool}-${GCC_MAJOR}\" -arch x86_64 \"\$@\"" \
                > "${WRAPPER_DIR}/${tool}"
              chmod +x "${WRAPPER_DIR}/${tool}"
            done
            echo "Cross-compiling osx-x64 with wrappers in ${WRAPPER_DIR}"
            CMAKE_ARGS+=(
              -DCMAKE_C_COMPILER="${WRAPPER_DIR}/gcc"
              -DCMAKE_CXX_COMPILER="${WRAPPER_DIR}/g++"
              -DCMAKE_Fortran_COMPILER="${WRAPPER_DIR}/gfortran"
            )
          else
            unset CC CXX FC
            echo "Using Homebrew GCC Fortran/C++: gfortran-${GCC_MAJOR}, g++-${GCC_MAJOR}"
            CMAKE_ARGS+=(
              -DCMAKE_Fortran_COMPILER="$GFORTRAN"
              -DCMAKE_CXX_COMPILER="${GCC_PREFIX}/bin/g++-${GCC_MAJOR}"
            )
          fi

          test -f native/ft4_coder/src/wsjtx_decode_stubs.c
          grep -q 'lib/fst4/fastosd240_74.f90' native/ft4_coder/cmake/WsjtxLibSources.cmake
          grep -q 'lib/gran.c' native/ft4_coder/cmake/WsjtxLibSources.cmake
          grep -q 'LINKER_LANGUAGE CXX' native/ft4_coder/CMakeLists.txt

          if [ "${{ matrix.rid }}" = "osx-arm64" ]; then
            CMAKE_ARGS+=(-DFFTW3_PREFIX="$(brew --prefix fftw)")
          elif [ -n "${FFTW3_PREFIX:-}" ]; then
            CMAKE_ARGS+=(-DFFTW3_PREFIX="${FFTW3_PREFIX}")
          fi
          if [ -n "${FFTW3F_LIB:-}" ]; then
            CMAKE_ARGS+=(-DFFTW3F_LIB="${FFTW3F_LIB}")
          fi
          if [ -n "${FFTW3F_THREADS_LIB:-}" ]; then
            CMAKE_ARGS+=(-DFFTW3F_THREADS_LIB="${FFTW3F_THREADS_LIB}")
          fi
          cmake "${CMAKE_ARGS[@]}"
          cmake --build build-ft4
          ctest --test-dir build-ft4 --output-on-failure

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p dist/${{ matrix.rid }}
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp build-ft4/ft4_coder.dll dist/${{ matrix.rid }}/
            cp build-ft4/ft4_smoke.exe dist/${{ matrix.rid }}/
          elif [ "${{ runner.os }}" = "macOS" ]; then
            cp build-ft4/libft4_coder.dylib dist/${{ matrix.rid }}/ft4_coder.dylib
            cp build-ft4/ft4_smoke dist/${{ matrix.rid }}/
          else
            cp build-ft4/libft4_coder.so dist/${{ matrix.rid }}/ft4_coder.so
            cp build-ft4/ft4_smoke dist/${{ matrix.rid }}/
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ft4_coder-${{ matrix.rid }}
          path: dist/${{ matrix.rid }}
          if-no-files-found: error

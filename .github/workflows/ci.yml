# Build and test on pull requests and pushes to main.
# Complements publish.yml, which builds, tests, and (on a version tag) runs the
# WA8LMF TNC benchmark before publishing. Windows compiles System.IO.Ports /
# System.Speech paths that Linux CI does not exercise.

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  DOTNET_VERSION: "10.0.x"

jobs:
  build-and-test:
    name: Build and test (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: Ubuntu
          - os: windows-latest
            name: Windows
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet build OscarWatch.slnx -c Release

      - run: dotnet test OscarWatch.slnx -c Release --no-build

# Build, test, and publish release packages on version tags (v*).
# A version tag also runs the WA8LMF TNC benchmark before packages are built.
# Package archives are uploaded as Actions artifacts only so the release job can
# attach them. That job then deletes the copies. A manual run keeps them for one
# day, which is the shortest retention upload-artifact allows.
# Manual run: Actions → Publish → Run workflow (skips the TNC benchmark).

name: Publish

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write
  actions: write

env:
  DOTNET_VERSION: "10.0.x"
  PROJECT: OscarWatch/OscarWatch.csproj

jobs:
  validate:
    name: Build and test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - run: dotnet build OscarWatch.slnx -c Release

      - run: dotnet test OscarWatch.slnx -c Release --no-build

  # Built-in packet modem against the WA8LMF TNC Test CD. Release tags only:
  # the tracks take minutes to decode, and installing ffmpeg has taken half an
  # hour on a slow apt mirror. The 250 MB ISO is cached across runs.
  modem-benchmark:
    name: Packet modem benchmark (WA8LMF TNC Test CD)
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    env:
      OSCARWATCH_TNC_TEST_CD: ${{ github.workspace }}/testdata/wa8lmf
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: actions/cache@v4
        with:
          path: testdata/wa8lmf
          key: wa8lmf-tnc-test-cd-v2

      - name: Install ffmpeg and 7-Zip
        run: sudo apt-get update && sudo apt-get install -y ffmpeg p7zip-full

      - name: Fetch the TNC Test CD
        shell: pwsh
        run: ./tools/fetch-tnc-test-cd.ps1

      - run: dotnet test OscarWatch.Tests/OscarWatch.Tests.csproj -c Release --filter "FullyQualifiedName~Wa8lmfBenchmarkTests" --logger "console;verbosity=detailed"

  publish:
    name: ${{ matrix.display_name }}
    needs: [validate, modem-benchmark]
    if: >-
      always() &&
      needs.validate.result == 'success' &&
      (needs.modem-benchmark.result == 'success' || needs.modem-benchmark.result == 'skipped')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            os: windows-latest
            display_name: Windows x64
            archive_ext: zip
            publish_single_file: true
          - rid: win-arm64
            os: windows-latest
            display_name: Windows ARM64
            archive_ext: zip
            publish_single_file: true
          - rid: osx-arm64
            os: macos-latest
            display_name: macOS Apple Silicon
            archive_ext: tar.gz
            publish_single_file: false
          - rid: osx-x64
            os: macos-latest
            display_name: macOS Intel
            archive_ext: tar.gz
            publish_single_file: false
          # Pinned to Ubuntu 24.04. ubuntu-latest moved to 26.04 and linked this
          # library against glibc 2.43 (log10f), which Linux Mint and Raspberry Pi OS cannot load.
          - rid: linux-x64
            os: ubuntu-24.04
            display_name: Linux x64
            archive_ext: tar.gz
            publish_single_file: false
          - rid: linux-arm64
            os: ubuntu-24.04
            display_name: Linux ARM64 (Raspberry Pi 64-bit)
            archive_ext: tar.gz
            publish_single_file: false

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Resolve version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.ref_type }}" == "tag" ]]; then
            ver="${GITHUB_REF_NAME#v}"
            echo "version=${ver}" >> "$GITHUB_OUTPUT"
            echo "assembly_version=${ver}" >> "$GITHUB_OUTPUT"
          else
            short="${GITHUB_SHA::7}"
            echo "version=0.0.0-ci.${short}" >> "$GITHUB_OUTPUT"
            # AssemblyVersion/FileVersion must be numeric (major.minor.build.revision).
            echo "assembly_version=0.0.0.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Build oscarwatch_ft8 (Windows)
        if: runner.os == 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          build_dir="native/oscarwatch_ft8/build-${rid}"
          out_dir="OscarWatch/runtimes/${rid}/native"
          mkdir -p "$out_dir"
          if [[ "$rid" == "win-arm64" ]]; then
            cmake -S native/oscarwatch_ft8 -B "$build_dir" -A ARM64
          else
            cmake -S native/oscarwatch_ft8 -B "$build_dir" -A x64
          fi
          cmake --build "$build_dir" --config Release
          dll="$(find "$build_dir" -name 'oscarwatch_ft8.dll' | head -n 1)"
          test -n "$dll"
          cp "$dll" "$out_dir/oscarwatch_ft8.dll"

      - name: Build oscarwatch_ft8 (macOS)
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          build_dir="native/oscarwatch_ft8/build-${rid}"
          out_dir="OscarWatch/runtimes/${rid}/native"
          mkdir -p "$out_dir"
          if [[ "$rid" == "osx-x64" ]]; then
            cmake -S native/oscarwatch_ft8 -B "$build_dir" -DCMAKE_OSX_ARCHITECTURES=x86_64
          else
            cmake -S native/oscarwatch_ft8 -B "$build_dir" -DCMAKE_OSX_ARCHITECTURES=arm64
          fi
          cmake --build "$build_dir" --config Release
          dylib="$(find "$build_dir" -name 'oscarwatch_ft8.dylib' | head -n 1)"
          test -n "$dylib"
          cp "$dylib" "$out_dir/oscarwatch_ft8.dylib"

      - name: Build oscarwatch_ft8 (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          rid="${{ matrix.rid }}"
          build_dir="native/oscarwatch_ft8/build-${rid}"
          out_dir="OscarWatch/runtimes/${rid}/native"
          mkdir -p "$out_dir"
          if [[ "$rid" == "linux-arm64" ]]; then
            sudo apt-get update
            sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
            cmake -S native/oscarwatch_ft8 -B "$build_dir" \
              -DCMAKE_SYSTEM_NAME=Linux \
              -DCMAKE_SYSTEM_PROCESSOR=aarch64 \
              -DCMAKE_C_COMPILER=aarch64-linux-gnu-gcc
          else
            cmake -S native/oscarwatch_ft8 -B "$build_dir"
          fi
          cmake --build "$build_dir" --config Release
          so="$(find "$build_dir" -name 'oscarwatch_ft8.so' | head -n 1)"
          test -n "$so"
          cp "$so" "$out_dir/oscarwatch_ft8.so"

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}/publish-${{ matrix.rid }}"
          $singleFile = "${{ matrix.publish_single_file }}"
          dotnet publish "${{ env.PROJECT }}" `
            -c Release `
            -r "${{ matrix.rid }}" `
            --self-contained true `
            -p:Version="${{ steps.version.outputs.version }}" `
            -p:AssemblyVersion="${{ steps.version.outputs.assembly_version }}" `
            -p:FileVersion="${{ steps.version.outputs.assembly_version }}" `
            -p:InformationalVersion="${{ steps.version.outputs.version }}" `
            -p:PublishSingleFile=$singleFile `
            -p:IncludeNativeLibrariesForSelfExtract=$singleFile `
            -o $out

      # portaudio.dll (from PortAudioSharp2) needs VCRUNTIME140.dll, which a PC without the
      # Visual C++ Redistributable lacks. Ship it beside the exe (Microsoft allows app-local copies).
      - name: Bundle the Visual C++ runtime (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $out = "${{ runner.temp }}/publish-${{ matrix.rid }}"
          $arch = if ("${{ matrix.rid }}" -eq "win-arm64") { "arm64" } else { "x64" }
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $crt = Get-ChildItem "$vs\VC\Redist\MSVC" -Directory |
            Sort-Object Name -Descending |
            ForEach-Object { Get-ChildItem "$($_.FullName)\$arch" -Directory -Filter "Microsoft.VC*.CRT" -ErrorAction SilentlyContinue } |
            Select-Object -First 1
          if (-not $crt) { throw "No Visual C++ runtime found for $arch under $vs" }
          foreach ($name in "vcruntime140.dll", "vcruntime140_1.dll") {
            $src = Join-Path $crt.FullName $name
            if (Test-Path $src) {
              Copy-Item $src $out -Force
              Write-Host "Bundled $src"
            }
          }
          if (-not (Test-Path (Join-Path $out "vcruntime140.dll"))) { throw "vcruntime140.dll was not bundled" }

      - name: Publish (Unix)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          out="${{ runner.temp }}/publish-${{ matrix.rid }}"
          dotnet publish "${{ env.PROJECT }}" \
            -c Release \
            -r "${{ matrix.rid }}" \
            --self-contained true \
            -p:Version="${{ steps.version.outputs.version }}" \
            -p:AssemblyVersion="${{ steps.version.outputs.assembly_version }}" \
            -p:FileVersion="${{ steps.version.outputs.assembly_version }}" \
            -p:InformationalVersion="${{ steps.version.outputs.version }}" \
            -o "$out"

      - name: Check FT4 native library is in the package
        shell: bash
        run: |
          set -euo pipefail
          out="${{ runner.temp }}/publish-${{ matrix.rid }}"
          rid="${{ matrix.rid }}"
          case "$rid" in
            win-*) file="oscarwatch_ft8.dll" ;;
            osx-*) file="oscarwatch_ft8.dylib" ;;
            linux-*) file="oscarwatch_ft8.so" ;;
            *) echo "Unknown RID: $rid"; exit 1 ;;
          esac
          path="$out/runtimes/$rid/native/$file"
          if [[ ! -f "$path" ]]; then
            echo "FT4 native library missing: $path"
            find "$out" -iname 'oscarwatch_ft8*' -print || true
            exit 1
          fi
          size=$(wc -c < "$path")
          echo "Found $path ($size bytes)"
          if [[ "$size" -lt 10000 ]]; then
            echo "FT4 native library looks too small: $path"
            exit 1
          fi

      # glibc 2.35 is Ubuntu 22.04, Linux Mint 21, and Raspberry Pi OS Bookworm.
      # A newer symbol (glibc 2.43 log10f on Ubuntu 26.04) loads as "library not found".
      - name: Check FT4 native library glibc is old enough (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -euo pipefail
          out="${{ runner.temp }}/publish-${{ matrix.rid }}"
          rid="${{ matrix.rid }}"
          so="$out/runtimes/$rid/native/oscarwatch_ft8.so"
          mapfile -t vers < <(readelf -V "$so" | sed -n 's/.*Name: \(GLIBC_[^[:space:]]*\).*/\1/p' | sort -u)
          if (( ${#vers[@]} == 0 )); then
            echo "No GLIBC versions found in $so"
            readelf -V "$so"
            exit 1
          fi
          echo "glibc symbol versions in $so:"
          printf '  %s\n' "${vers[@]}"
          bad=0
          for v in "${vers[@]}"; do
            num="${v#GLIBC_}"
            major="${num%%.*}"
            rest="${num#*.}"
            minor="${rest%%.*}"
            if (( major > 2 || (major == 2 && minor > 35) )); then
              echo "Too new: $v"
              bad=1
            fi
          done
          if (( bad )); then
            echo "oscarwatch_ft8.so must not require glibc newer than 2.35."
            exit 1
          fi

      - name: Check FT4 native library needs no Visual C++ Redistributable (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $dll = "${{ runner.temp }}/publish-${{ matrix.rid }}/runtimes/${{ matrix.rid }}/native/oscarwatch_ft8.dll"
          $vs = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -property installationPath
          $dumpbin = Get-ChildItem "$vs\VC\Tools\MSVC" -Recurse -Filter dumpbin.exe | Where-Object { $_.FullName -match 'Hostx64\\x64' } | Select-Object -First 1
          $deps = & $dumpbin.FullName /dependents $dll | Out-String
          Write-Host $deps
          if ($deps -match '(?i)vcruntime|msvcp|api-ms-win-crt') { throw "oscarwatch_ft8.dll still depends on the Visual C++ runtime" }

      - name: Archive
        id: archive
        shell: pwsh
        run: |
          $src = "${{ runner.temp }}/publish-${{ matrix.rid }}"
          $version = "${{ steps.version.outputs.version }}"
          $rid = "${{ matrix.rid }}"
          if ("${{ matrix.archive_ext }}" -eq "zip") {
            $dest = "${{ runner.temp }}/OscarWatch-${version}-${rid}.zip"
            Compress-Archive -Path "$src/*" -DestinationPath $dest -Force
          } else {
            $dest = "${{ runner.temp }}/OscarWatch-${version}-${rid}.tar.gz"
            tar -czf $dest -C $src .
          }
          echo "path=$dest" >> $env:GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: OscarWatch-${{ matrix.rid }}
          path: ${{ steps.archive.outputs.path }}
          if-no-files-found: error
          retention-days: 1

  release:
    name: GitHub Release
    needs: publish
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**
          generate_release_notes: true

      # Operator notes live in the tagged commit. When that file is present it
      # replaces the generated commit list. A tag without the file keeps the
      # generated notes.
      - uses: actions/checkout@v4

      - name: Publish operator release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ -f .github/RELEASE_NOTES.md ]]; then
            gh release edit "${GITHUB_REF_NAME}" --notes-file .github/RELEASE_NOTES.md
          else
            echo "No .github/RELEASE_NOTES.md on this tag. Keeping the generated notes."
          fi

      - name: Delete Actions copies of the release packages
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          ids=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[].id')
          for id in $ids; do
            gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${id}"
            echo "Deleted artifact ${id}"
          done
